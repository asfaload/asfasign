[package]
name = "signatures"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
minisign = "0.9.0"
serde_json = "1.0.143"
thiserror = "2.0.12"
common = { path = "../common/" }
constants = { path = "../constants/" }
serde = "1.0.228"
ed25519-dalek = { version = "2.1", features = [
  "pkcs8",
  "rand_core",
  "pem",
  "zeroize",
] }
pkcs8 = { version = "0.10", features = ["encryption", "pem", "std"] }
rand = "0.8"
scrypt = "0.11"

[dev-dependencies]
anyhow = "1.0.98"
tempfile = "3.20.0"

[lints]
workspace = true
